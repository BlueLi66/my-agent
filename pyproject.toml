[project]
name = "my-agent"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["anthropic>=0.25.0", "python-dotenv", "pyyaml"]

[project.scripts]
my-agent = "my_agent.cli.app:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
